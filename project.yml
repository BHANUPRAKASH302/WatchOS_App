name: MultiDomainAssistant
options:
  bundleIdPrefix: com.vynedam
targets:
  MultiDomainAssistant:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - VynedamWatchApp
    settings:
      base:
        PRODUCT_NAME: "Multi-Domain Assistant"
        INFOPLIST_KEY_CFBundleDisplayName: "Multi-Domain Assistant"
        PRODUCT_BUNDLE_IDENTIFIER: com.vynedam.watchapp
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator
